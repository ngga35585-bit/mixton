
name: Build MIXTON APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MIXTON project
        run: |
          set -e
          echo "Searching for MIXTON ZIP..."
          ls -la

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'MIXTON-APK-project.zip*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MIXTON ZIP archive not found!"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source
          cp -a source/. .
          rm -rf source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIXTON-APK
          path: app/build/outputs/apk/debug/app-debug.apk
